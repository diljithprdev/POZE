<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>POZE — launcher icon preview</title>
<style>
  :root{
    --home-base:#12161C; --menu-bg:#1B2129; --menu-bg-alt:#212831;
    --menu-border:#33404B; --menu-border-soft:rgba(255,255,255,.165);
    --accent:#4E9EA6; --accent-dark:#3E848B; --accent-soft:#77C0C6;
    --on-accent:#0E131A; --on-surface:#ECE9E2; --on-surface-dim:#A6AFB7; --tertiary:#79828B;
    --sand:#DCC9A8; --icon-bg:#141A22;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0B0E12;color:var(--on-surface);font-family:var(--sans);padding:32px;display:flex;flex-direction:column;gap:36px;align-items:center}
  h1{font-family:var(--serif);letter-spacing:.14em;color:var(--sand);font-size:24px;font-weight:700}
  .cap{font-size:12px;letter-spacing:.12em;color:var(--tertiary);text-transform:uppercase;text-align:center}
  h2{font-family:var(--serif);letter-spacing:.1em;color:var(--sand);font-size:16px;font-weight:700;margin-top:8px}

  .cards{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;max-width:1200px}
  .card{background:var(--menu-bg);border:1px solid var(--menu-border-soft);border-radius:18px;padding:20px;width:440px;display:flex;flex-direction:column;gap:16px}
  .card h3{font-size:15px;font-weight:700;color:var(--on-surface)}
  .card .note{font-size:12px;color:var(--on-surface-dim);line-height:1.35}

  .icon{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto;overflow:hidden}
  .mark{display:flex;align-items:center;justify-content:center}
  .guide{position:absolute;border:1.5px dashed rgba(255,255,255,.35);border-radius:50%;pointer-events:none}

  .mrow{display:flex;gap:18px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
  .mcell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .mcell .lbl{font-size:10px;color:var(--tertiary)}

  .sizes{display:flex;gap:14px;align-items:flex-end;justify-content:center}
  .sizes .mcell .lbl{font-size:10px}

  .anatom{display:flex;gap:16px;justify-content:center}
  .anatom .mcell .lbl{font-size:10px;color:var(--tertiary)}

  /* home screen context */
  .home{width:360px;background:#10141A;border:1px solid #232a33;border-radius:28px;padding:24px 18px;display:flex;flex-direction:column;gap:22px}
  .clock{text-align:center;color:#E9E6DF}
  .clock .t{font-size:40px;font-weight:300;letter-spacing:.02em}
  .clock .d{font-size:12px;color:var(--on-surface-dim);margin-top:2px}
  .appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
  .app{display:flex;flex-direction:column;align-items:center;gap:6px}
  .app .lbl{font-size:10px;color:#cfcac0}
  .app .ph{width:48px;height:48px;border-radius:13px;background:var(--menu-bg-alt);border:1px solid var(--menu-border);display:flex;align-items:center;justify-content:center;color:#4b5563}
  .theme-strip{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
  .themed{display:flex;flex-direction:column;align-items:center;gap:8px}
  .chip{width:112px;height:112px;border-radius:26px;display:flex;align-items:center;justify-content:center}
  .chip.light{background:#E9E3DA}
  .chip.dark{background:#1C1B1F}
  .chip .lbl{font-size:10px}
</style>
</head>
<body>

  <h1>POZE · launcher icon</h1>
  <div class="cap">Adaptive icon preview — masks, real sizes, safe zone, themed</div>

  <div class="cards" id="cards"></div>

  <h2>Home-screen context</h2>
  <div class="cap">How each candidate reads at real size among other apps</div>
  <div class="cards" id="homescreens" style="max-width:1200px"></div>

  <h2>Android 13 themed (monochrome)</h2>
  <div class="cap">Single-color glyph the system tints per wallpaper</div>
  <div class="theme-strip" id="themed"></div>

<script>
  const SERIF = "Georgia,'Times New Roman',serif";

  // ---- Candidate marks -------------------------------------------------
  const candidates = [
    {
      id:"A-current", title:"A · Original asset (true size)",
      note:"The asset as originally shipped, drawn at its real size (~59dp wide within the 66dp circular safe zone). A wide, thin band — legible but light.",
      bg:"#141A22",
      mark:{type:"text", text:"POZE", color:"#DCC9A8", f:0.36, ls:0.12}
    },
    {
      id:"B-wordmark-big", title:"B · Wordmark, enlarged — CHOSEN",
      note:"Chosen. Same POZE wordmark scaled ~1.12× — the most it can grow while staying inside the circular safe zone on every launcher.",
      bg:"#141A22",
      mark:{type:"text", text:"POZE", color:"#DCC9A8", f:0.40, ls:0.08}
    },
    {
      id:"C-monogram", title:"C · “P” monogram",
      note:"Single serif letter in sand. Simplest, boldest, and unmistakable at 32px. Pairs with the in-app wordmark.",
      bg:"#141A22",
      mark:{type:"text", text:"P", color:"#DCC9A8", f:0.95, ls:0}
    },
    {
      id:"D-aqua", title:"D · Aqua monogram",
      note:"Aqua background with a dark monogram — uses the brand accent instead of near-black. Pops on any wallpaper.",
      bg:"#4E9EA6",
      mark:{type:"text", text:"P", color:"#0E131A", f:0.95, ls:0}
    },
    {
      id:"E-viewfinder", title:"E · Alignment mark",
      note:"Viewfinder brackets + focus dot — literal to what POZE does (align a reference). Sand on near-black.",
      bg:"#14181F",
      mark:{type:"svg", color:"#DCC9A8", viewBox:"0 0 100 100"}
    }
  ];

  // viewfinder glyph
  const viewfinder = `
    <g fill="none" stroke="color" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 42 V20 H42"/>
      <path d="M58 20 H80 V42"/>
      <path d="M80 58 V80 H58"/>
      <path d="M42 80 H20 V58"/>
    </g>
    <circle cx="50" cy="50" r="7" fill="color"/>`;

  function radiusFor(mask,size){
    if(mask==="circle") return "50%";
    if(mask==="squircle") return (size*0.28)+"px";
    if(mask==="rounded") return (size*0.18)+"px";
    return (size*0.08)+"px";
  }

  function markHTML(mark, box){
    if(mark.type==="text"){
      return `<span style="font-family:${SERIF};font-weight:700;color:${mark.color};font-size:${box*mark.f}px;letter-spacing:${mark.ls||0}em;line-height:1;white-space:nowrap">${mark.text}</span>`;
    }
    return `<svg width="${box}" height="${box}" viewBox="${mark.viewBox}" style="color:${mark.color}">${viewfinder.replaceAll("color", mark.color)}</svg>`;
  }

  function iconHTML(cand, size, mask, opts={}){
    const box = size*(66/108); // adaptive safe zone is central 66dp of 108dp
    const guide = opts.guide
      ? `<div class="guide" style="width:${box}px;height:${box}px"></div>` : "";
    return `<div class="icon" style="width:${size}px;height:${size}px;background:${cand.bg};border-radius:${radiusFor(mask,size)}">
              ${guide}
              <div class="mark" style="width:${box}px;height:${box}px">${markHTML(cand.mark, box)}</div>
            </div>`;
  }

  // ---- Card builder ----------------------------------------------------
  const cards = document.getElementById("cards");
  candidates.forEach(cand => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div>
        <h3>${cand.title}</h3>
        <div class="note" style="margin-top:6px">${cand.note}</div>
      </div>
      <div class="mrow">
        <div class="mcell">${iconHTML(cand,192,"circle")}<span class="lbl">192 · circle</span></div>
        <div class="mcell">${iconHTML(cand,192,"squircle")}<span class="lbl">192 · squircle</span></div>
        <div class="mcell">${iconHTML(cand,192,"rounded")}<span class="lbl">192 · rounded</span></div>
      </div>
      <div class="sizes">
        ${[72,56,48,40,32].map(s=>`<div class="mcell">${iconHTML(cand,s,"circle")}<span class="lbl">${s}</span></div>`).join("")}
      </div>
      <div class="anatom">
        <div class="mcell">${iconHTML(cand,120,"squircle",{guide:true})}<span class="lbl">safe zone (66/108)</span></div>
        <div class="mcell">${iconHTML(cand,120,"squircle")}<span class="lbl">final</span></div>
      </div>`;
    cards.appendChild(el);
  });

  // ---- Home screen context --------------------------------------------
  const homes = document.getElementById("homescreens");
  const filler = `<div class="ph"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/></svg></div>`;
  ["A-current","B-wordmark-big","C-monogram","D-aqua","E-viewfinder"].forEach(id=>{
    const cand = candidates.find(c=>c.id===id);
    let cells = `<div class="app">${iconHTML(cand,48,"rounded")}<span class="lbl">POZE</span></div>`;
    for(let i=0;i<7;i++) cells += `<div class="app">${filler}<span class="lbl">App</span></div>`;
    const el = document.createElement("div");
    el.className = "home";
    el.innerHTML = `
      <div class="clock"><div class="t">9:41</div><div class="d">Monday, 12 March</div></div>
      <div class="appgrid">${cells}</div>
      <div class="cap" style="margin-top:4px">${cand.title}</div>`;
    homes.appendChild(el);
  });

  // ---- Themed / monochrome -------------------------------------------
  const themed = document.getElementById("themed");
  ["C-monogram","E-viewfinder"].forEach(id=>{
    const cand = candidates.find(c=>c.id===id);
    const mono = {
      ...cand,
      mark: cand.mark.type==="text"
        ? {...cand.mark, color:"currentColor"}
        : {...cand.mark}
    };
    const wrap = document.createElement("div");
    wrap.className = "themed";
    wrap.innerHTML = `
      <div style="display:flex;gap:16px">
        <div class="chip light" style="color:#1C1B1F">${markHTML({...mono.mark,color:"#1C1B1F"},86)}</div>
        <div class="chip dark" style="color:#E9E3DA">${markHTML({...mono.mark,color:"#E9E3DA"},86)}</div>
      </div>
      <div class="lbl" style="color:var(--tertiary)">${cand.title} · themed</div>`;
    themed.appendChild(wrap);
  });
</script>

</body>
</html>
