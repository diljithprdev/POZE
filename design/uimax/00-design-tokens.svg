<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1220" viewBox="0 0 900 1220" font-family="Roboto, Arial, sans-serif">
  <title>POZE design tokens</title>
  <desc>Colour, typography, spacing, radius and motion tokens for the POZE Android app.</desc>

  <g id="sheet-header">
    <text x="60" y="58" font-size="28" font-weight="700" fill="#F8FAFC">POZE — design tokens</text>
    <text x="60" y="88" font-size="13" fill="#7A879B">Dark navy identity · 1 unit = 1dp · screens 411 × 891dp · XML Views + Material Components</text>
  </g>

  <g id="design-tokens-color">
    <text x="60" y="140" font-size="11" font-weight="500" letter-spacing="2" fill="#94A3B8">COLOUR</text>

    <g id="token-color-background">
      <rect x="60" y="160" width="180" height="64" rx="8" fill="#08152D" stroke="#334155"/>
      <text x="60" y="242" font-size="11" fill="#C3CEDE">background base</text>
      <text x="60" y="258" font-size="10" fill="#7A879B">#08152D</text>
    </g>
    <g id="token-color-background-end">
      <rect x="260" y="160" width="180" height="64" rx="8" fill="#050711" stroke="#334155"/>
      <text x="260" y="242" font-size="11" fill="#C3CEDE">background end</text>
      <text x="260" y="258" font-size="10" fill="#7A879B">#050711</text>
    </g>
    <g id="token-color-panel">
      <rect x="460" y="160" width="180" height="64" rx="8" fill="#141D33" stroke="#334155"/>
      <text x="460" y="242" font-size="11" fill="#C3CEDE">overlay panel</text>
      <text x="460" y="258" font-size="10" fill="#7A879B">#141D33</text>
    </g>
    <g id="token-color-card">
      <rect x="660" y="160" width="180" height="64" rx="8" fill="#18223C" stroke="#26FFFFFF"/>
      <text x="660" y="242" font-size="11" fill="#C3CEDE">menu card / tile</text>
      <text x="660" y="258" font-size="10" fill="#7A879B">#18223C</text>
    </g>

    <g id="token-color-accent">
      <rect x="60" y="280" width="180" height="64" rx="8" fill="#2563EB"/>
      <text x="60" y="362" font-size="11" fill="#C3CEDE">accent</text>
      <text x="60" y="378" font-size="10" fill="#7A879B">#2563EB</text>
    </g>
    <g id="token-color-accent-soft">
      <rect x="260" y="280" width="180" height="64" rx="8" fill="#3B82F6"/>
      <text x="260" y="362" font-size="11" fill="#C3CEDE">accent soft</text>
      <text x="260" y="378" font-size="10" fill="#7A879B">#3B82F6</text>
    </g>
    <g id="token-color-cta">
      <rect x="460" y="280" width="180" height="64" rx="8" fill="#0D1B3B" stroke="#79A8FF" stroke-width="1.5"/>
      <text x="460" y="362" font-size="11" fill="#C3CEDE">CTA fill / pressed #122657</text>
      <text x="460" y="378" font-size="10" fill="#7A879B">#0D1B3B</text>
    </g>
    <g id="token-color-violet">
      <rect x="660" y="280" width="180" height="64" rx="8" fill="#8B5CF6"/>
      <text x="660" y="362" font-size="11" fill="#C3CEDE">wordmark glow</text>
      <text x="660" y="378" font-size="10" fill="#7A879B">#8B5CF6</text>
    </g>

    <g id="token-color-text-primary">
      <rect x="60" y="400" width="180" height="64" rx="8" fill="#F8FAFC"/>
      <text x="60" y="482" font-size="11" fill="#C3CEDE">text primary</text>
      <text x="60" y="498" font-size="10" fill="#7A879B">#F8FAFC</text>
    </g>
    <g id="token-color-text-secondary">
      <rect x="260" y="400" width="180" height="64" rx="8" fill="#C3CEDE"/>
      <text x="260" y="482" font-size="11" fill="#C3CEDE">text secondary</text>
      <text x="260" y="498" font-size="10" fill="#7A879B">#C3CEDE</text>
    </g>
    <g id="token-color-text-tertiary">
      <rect x="460" y="400" width="180" height="64" rx="8" fill="#7A879B"/>
      <text x="460" y="482" font-size="11" fill="#C3CEDE">text tertiary</text>
      <text x="460" y="498" font-size="10" fill="#7A879B">#7A879B</text>
    </g>
    <g id="token-color-divider">
      <rect x="660" y="400" width="180" height="64" rx="8" fill="#18223C" stroke="#334155"/>
      <rect x="660" y="430" width="180" height="1" fill="#1FFFFFFF"/>
      <text x="660" y="482" font-size="11" fill="#C3CEDE">divider 12% white</text>
      <text x="660" y="498" font-size="10" fill="#7A879B">#1FFFFFFF</text>
    </g>

    <g id="token-color-success">
      <rect x="60" y="520" width="180" height="64" rx="8" fill="#22C55E"/>
      <text x="60" y="602" font-size="11" fill="#C3CEDE">active / success</text>
      <text x="60" y="618" font-size="10" fill="#7A879B">#22C55E</text>
    </g>
    <g id="token-color-warning">
      <rect x="260" y="520" width="180" height="64" rx="8" fill="#FBBF24"/>
      <text x="260" y="602" font-size="11" fill="#C3CEDE">attention dot</text>
      <text x="260" y="618" font-size="10" fill="#7A879B">#FBBF24</text>
    </g>
    <g id="token-color-danger">
      <rect x="460" y="520" width="180" height="64" rx="8" fill="#DC2626"/>
      <text x="460" y="602" font-size="11" fill="#C3CEDE">danger / stop</text>
      <text x="460" y="618" font-size="10" fill="#7A879B">#DC2626 pressed #B91C1C</text>
    </g>
    <g id="token-color-border">
      <rect x="660" y="520" width="180" height="64" rx="8" fill="#334155"/>
      <text x="660" y="602" font-size="11" fill="#C3CEDE">border</text>
      <text x="660" y="618" font-size="10" fill="#7A879B">#334155</text>
    </g>
  </g>

  <g id="design-tokens-type">
    <text x="60" y="686" font-size="11" font-weight="500" letter-spacing="2" fill="#94A3B8">TYPOGRAPHY</text>

    <g id="type-display">
      <text x="60" y="746" font-size="46" font-weight="800" letter-spacing="6.4" fill="#F8FAFC">POZE</text>
      <text x="840" y="740" font-size="11" text-anchor="end" fill="#7A879B">display 46 / black / +0.14</text>
    </g>
    <g id="type-title">
      <text x="60" y="792" font-size="20" font-weight="500" fill="#E2E8F0">Choose reference</text>
      <text x="840" y="788" font-size="11" text-anchor="end" fill="#7A879B">title 20 / medium</text>
    </g>
    <g id="type-headline">
      <text x="60" y="830" font-size="16" font-weight="500" fill="#FFFFFF">Select Image</text>
      <text x="840" y="826" font-size="11" text-anchor="end" fill="#7A879B">headline 16 / medium</text>
    </g>
    <g id="type-body">
      <text x="60" y="864" font-size="15" fill="#F8FAFC">Rotate</text>
      <text x="840" y="860" font-size="11" text-anchor="end" fill="#7A879B">body 15 / regular</text>
    </g>
    <g id="type-body-small">
      <text x="60" y="898" font-size="14" fill="#F8FAFC">Overlay permission</text>
      <text x="840" y="894" font-size="11" text-anchor="end" fill="#7A879B">body small 14 / medium</text>
    </g>
    <g id="type-caption">
      <text x="60" y="932" font-size="12" fill="#C3CEDE">Float a reference over any app</text>
      <text x="840" y="928" font-size="11" text-anchor="end" fill="#7A879B">caption 12</text>
    </g>
    <g id="type-label">
      <text x="60" y="964" font-size="11" font-weight="500" letter-spacing="1.3" fill="#94A3B8">OVERLAY</text>
      <text x="840" y="960" font-size="11" text-anchor="end" fill="#7A879B">label 11 / uppercase / +0.12</text>
    </g>
  </g>

  <g id="design-tokens-spacing">
    <text x="60" y="1016" font-size="11" font-weight="500" letter-spacing="2" fill="#94A3B8">SPACING</text>
    <g id="space-2"><rect x="60" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="93" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">2</text></g>
    <g id="space-4"><rect x="136" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="169" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">4</text></g>
    <g id="space-6"><rect x="212" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="245" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">6</text></g>
    <g id="space-8"><rect x="288" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="321" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">8</text></g>
    <g id="space-12"><rect x="364" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="397" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">12</text></g>
    <g id="space-16"><rect x="440" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="473" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">16</text></g>
    <g id="space-18"><rect x="516" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="549" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">18</text></g>
    <g id="space-20"><rect x="592" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="625" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">20</text></g>
    <g id="space-24"><rect x="668" y="1032" width="66" height="30" rx="6" fill="#18223C" stroke="#26FFFFFF"/><text x="701" y="1052" font-size="11" text-anchor="middle" fill="#C3CEDE">24</text></g>
    <text x="60" y="1082" font-size="11" fill="#7A879B">Screen gutter 20 (home) / 24 (gallery) · overlay panel padding 18 · minimum touch target 48</text>
  </g>

  <g id="design-tokens-radius">
    <text x="60" y="1130" font-size="11" font-weight="500" letter-spacing="2" fill="#94A3B8">RADIUS</text>
    <g id="radius-12"><rect x="60" y="1146" width="70" height="46" rx="12" fill="#18223C" stroke="#26FFFFFF"/><text x="95" y="1174" font-size="11" text-anchor="middle" fill="#94A3B8">12</text></g>
    <g id="radius-14"><rect x="150" y="1146" width="70" height="46" rx="14" fill="#18223C" stroke="#26FFFFFF"/><text x="185" y="1174" font-size="11" text-anchor="middle" fill="#94A3B8">14</text></g>
    <g id="radius-20"><rect x="240" y="1146" width="70" height="46" rx="20" fill="#18223C" stroke="#26FFFFFF"/><text x="275" y="1174" font-size="11" text-anchor="middle" fill="#94A3B8">20</text></g>
    <g id="radius-22"><rect x="330" y="1146" width="70" height="46" rx="22" fill="#18223C" stroke="#26FFFFFF"/><text x="365" y="1174" font-size="11" text-anchor="middle" fill="#94A3B8">22</text></g>
    <text x="430" y="1174" font-size="11" fill="#7A879B">12 segment · 14 row + tile · 20 panel + dialog · 22 pill CTA</text>
  </g>
</svg>
