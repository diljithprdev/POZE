<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" font-family="Roboto, Arial, sans-serif">
  <title>POZE — Overlay permission dialog</title>
  <desc>Branded dark dialog matching the app surface, launched from the Grant button.</desc>
  <g id="popup-permission-dialog">
    <rect id="dialog-surface" x="0" y="0" width="340" height="190" rx="20" fill="#16203A" stroke="#334155"/>

    <g id="dialog-icon">
      <circle cx="44" cy="46" r="18" fill="#1A2A4D"/>
      <path d="M44 38 V50" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="44" cy="56" r="1.8" fill="#FBBF24"/>
    </g>

    <g id="dialog-text">
      <text x="76" y="44" font-size="18" font-weight="500" fill="#E8EEF8">Permission required</text>
      <text x="24" y="86" font-size="14" fill="#C3CEDE">POZE needs permission to display over other</text>
      <text x="24" y="108" font-size="14" fill="#C3CEDE">apps. This is required for the reference</text>
      <text x="24" y="130" font-size="14" fill="#C3CEDE">overlay to work.</text>
    </g>

    <g id="dialog-actions">
      <line x1="0" y1="146" x2="340" y2="146" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="228" y="174" font-size="14" font-weight="500" text-anchor="middle" fill="#94A3B8">CANCEL</text>
      <text x="312" y="174" font-size="14" font-weight="500" text-anchor="middle" fill="#3B82F6">GRANT PERMISSION</text>
    </g>
  </g>
</svg>
