<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200" font-family="Roboto, Arial, sans-serif">
  <title>POZE — Overlay bubble</title>
  <desc>56dp draggable overlay control. States: default, pressed, menu open.</desc>
  <defs>
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <g id="overlay-bubble-specimen">
    <text x="80" y="18" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="1.4" fill="#94A3B8">OVERLAY BUBBLE 56dp</text>

    <g id="state-bubble-default">
      <circle cx="52" cy="64" r="34" fill="#000000" opacity="0.3"/>
      <circle cx="52" cy="62" r="28" fill="url(#bubbleGrad)"/>
      <path d="M43 62 L49 68 L62 55" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="112" font-size="10" text-anchor="middle" fill="#7A879B">default</text>
    </g>

    <g id="state-bubble-pressed">
      <circle cx="110" cy="64" r="34" fill="#000000" opacity="0.3"/>
      <circle cx="110" cy="62" r="28" fill="#1D4ED8"/>
      <circle cx="110" cy="62" r="28" fill="#FFFFFF" opacity="0.12"/>
      <path d="M101 62 L107 68 L120 55" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="112" font-size="10" text-anchor="middle" fill="#7A879B">pressed</text>
    </g>

    <g id="state-bubble-menu-open">
      <circle cx="52" cy="156" r="28" fill="url(#bubbleGrad)"/>
      <rect x="86" y="142" width="6" height="26" rx="3" fill="#FFFFFF"/>
      <rect x="96" y="149" width="6" height="19" rx="3" fill="#FFFFFF"/>
      <rect x="106" y="155" width="6" height="13" rx="3" fill="#FFFFFF"/>
      <text x="52" y="192" font-size="10" text-anchor="middle" fill="#7A879B">menu open</text>
    </g>
  </g>
</svg>
