<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="411" height="891" viewBox="0 0 411 891" font-family="Roboto, Arial, sans-serif">
  <title>POZE — Home (overlay permission required)</title>
  <defs>
    <linearGradient id="homeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08152D"/>
      <stop offset="0.5" stop-color="#090D1B"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="permGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24FFFFFF"/>
      <stop offset="1" stop-color="#0CA9C8FF"/>
    </linearGradient>
    <linearGradient id="grantGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="411" height="891"/></clipPath>
  </defs>

  <g id="screen-home" clip-path="url(#frame)">
    <rect id="home-background" x="0" y="0" width="411" height="891" fill="url(#homeGrad)"/>
    <circle id="home-glow-blue" cx="60" cy="120" r="170" fill="url(#glowBlue)"/>
    <circle id="home-glow-violet" cx="391" cy="771" r="160" fill="url(#glowViolet)"/>

    <g id="home-brand-block">
      <text id="wordmark-glow" x="205.5" y="58" font-size="46" font-weight="800" letter-spacing="6.4" text-anchor="middle" fill="#A78BFA" opacity="0.28">POZE</text>
      <text id="wordmark" x="205.5" y="58" font-size="46" font-weight="800" letter-spacing="6.4" text-anchor="middle" fill="#FFFFFF">POZE</text>
      <text id="home-headline" x="205.5" y="93" font-size="15" text-anchor="middle" fill="#E2E8F0">Reference Image Overlay Tool</text>
      <text id="home-sub" x="205.5" y="111" font-size="12" text-anchor="middle" fill="#AAB6CA">Float a reference over any app and align your shot.</text>
    </g>

    <g id="home-permission-card">
      <rect x="20" y="696" width="371" height="72" rx="14" fill="url(#permGrad)" stroke="#29FFFFFF"/>
      <circle id="permission-dot" cx="36" cy="721" r="5" fill="#FBBF24"/>
      <text id="permission-title" x="48" y="725" font-size="14" font-weight="500" fill="#FFFFFF">Overlay permission</text>
      <text id="permission-subtitle" x="48" y="743" font-size="12" fill="#C3CEDE">Needed to float over other apps</text>
      <g id="component-button-grant">
        <rect x="287" y="710" width="76" height="44" rx="4" fill="url(#grantGrad)"/>
        <text x="325" y="737" font-size="14" font-weight="500" text-anchor="middle" fill="#FFFFFF">Grant</text>
      </g>
    </g>

    <g id="component-button-primary">
      <rect x="20" y="780" width="371" height="64" rx="22" fill="#0D1B3B" stroke="#79A8FF" stroke-width="1.5"/>
      <rect x="104" y="799" width="26" height="26" rx="6" fill="#FAFFFFFF"/>
      <rect x="111" y="806" width="12" height="10" fill="none" stroke="#214B9B" stroke-width="1.4"/>
      <path d="M111 815 L115.5 809.5 L118.5 813 L121 810.5 L123 815 Z" fill="#214B9B"/>
      <text x="142" y="818" font-size="16" font-weight="500" fill="#FFFFFF">Select Image</text>
      <path d="M262 806 L268 812 L262 818" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    </g>

    <text id="home-hint" x="205.5" y="867" font-size="12" text-anchor="middle" fill="#AAB6CA">Pick a reference, then drag the blue bubble over the camera app.</text>
  </g>
</svg>
